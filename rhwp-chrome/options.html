<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>rhwp 설정</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #333333;
      --muted: #6b7280;
      --border: #e5e7eb;
      --select-bg: #ffffff;
    }
    :root[data-theme='dark'] {
      color-scheme: dark;
      --bg: #171b22;
      --text: #e4e8ef;
      --muted: #a5afc0;
      --border: #4b5668;
      --select-bg: #242a34;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); max-width: 480px; margin: 40px auto; padding: 0 20px; color: var(--text); }
    h1 { font-size: 20px; margin-bottom: 24px; }
    .option { margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .option-theme { justify-content: space-between; }
    .option label { cursor: pointer; }
    .option select {
      min-width: 170px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--select-bg);
      color: var(--text);
      padding: 6px 10px;
    }
    .saved { color: #16a34a; font-size: 13px; opacity: 0; transition: opacity 0.3s; }
    .saved.show { opacity: 1; }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .info { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <h1 id="title"></h1>

  <div class="option option-theme">
    <label for="themeMode" id="labelThemeMode"></label>
    <select id="themeMode">
      <option value="system" id="themeOptionSystem"></option>
      <option value="light" id="themeOptionLight"></option>
      <option value="dark" id="themeOptionDark"></option>
    </select>
  </div>

  <div class="option">
    <input type="checkbox" id="autoOpen" checked>
    <label for="autoOpen" id="labelAutoOpen"></label>
  </div>

  <div class="option">
    <input type="checkbox" id="showBadges" checked>
    <label for="showBadges" id="labelShowBadges"></label>
  </div>

  <div class="option">
    <input type="checkbox" id="hoverPreview" checked>
    <label for="hoverPreview" id="labelHoverPreview"></label>
  </div>

  <span class="saved" id="saved"></span>

  <hr>
  <p class="info">
    rhwp v<span id="version">-</span> — MIT<br>
    <span id="privacy"></span>
  </p>

  <script src="options.js"></script>
</body>
</html>
